<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barkboard Portal</title>
    <link rel="icon" href="https://fav.farm/🐾" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">🐾 Barkboard</div>
        <nav>
            <button onclick="switchView('staff-view')" class="nav-btn">Staff Feed</button>
            <button onclick="switchView('crm-view')" class="nav-btn active">People & Pets</button>
            <button onclick="switchView('calendar-view')" class="nav-btn">Resource Grid</button>
            <button onclick="switchView('owner-view')" class="nav-btn">Owner Portal</button>
        </nav>
    </header>

    <main class="container">
        
        <section id="staff-view" class="view-panel hidden">
            <h2>Today's Overview</h2>
            <p>Staff feed metrics...</p>
        </section>

        <section id="crm-view" class="view-panel">
            <div class="crm-header">
                <h2>Registry Directory & Global Relations</h2>
                
                <div class="controls-row">
                    <input type="text" id="crm-search" placeholder="Search entries..." onkeyup="renderCRM()">
                    <button class="btn toggle-layout-btn" onclick="toggleLayout()">📋 Switch to List View</button>
                    <button class="btn btn-primary" onclick="openRelationshipModal()">⛓️ Link New Relationship</button>
                </div>

                <div class="filter-menu">
                    <button id="filter-all" class="filter-chip active" onclick="setEntityFilter('all')">All Entries</button>
                    <button id="filter-household" class="filter-chip" onclick="setEntityFilter('household')">Households</button>
                    <button id="filter-people" class="filter-chip" onclick="setEntityFilter('people')">People</button>
                    <button id="filter-pets" class="filter-chip" onclick="setEntityFilter('pets')">Pets</button>
                    <button id="filter-vets" class="filter-chip" onclick="setEntityFilter('vets')">Vets / COIs</button>
                </div>
            </div>

            <div id="crm-list-container" class="card-layout"></div>
        </section>

        <div id="relationship-modal" class="modal hidden">
            <div class="modal-content">
                <h3>Link Cross-Entity Relationship</h3>
                <form id="relation-form" onsubmit="saveNewRelationship(event)">
                    <div class="form-group">
                        <label>Select Primary Entity:</label>
                        <select id="modal-entity-a" required></select>
                    </div>
                    
                    <div class="form-group">
                        <label>Relationship Configuration:</label>
                        <select id="modal-relation-type" onchange="toggleRelationshipFields()" required>
                            <option value="vet">Uses Veterinary Clinic / COI</option>
                            <option value="emergency">Emergency Contact Connection</option>
                            <option value="family">Extended Family / Neighbor Boundary</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Select Target Entity to Link:</label>
                        <select id="modal-entity-b" required></select>
                    </div>

                    <div class="form-group id="custom-note-group">
                        <label>Relationship Note / Tag Identifier:</label>
                        <input type="text" id="modal-relation-note" placeholder="e.g., Neighbor who has key, Primary Co-op vet">
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn" onclick="closeRelationshipModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Establish Link & Sync</button>
                    </div>
                </form>
            </div>
        </div>

        <section id="calendar-view" class="view-panel hidden"><h2>Calendar</h2></section>
        <section id="owner-view" class="view-panel hidden"><h2>Owner Portal</h2></section>
    </main>

    <script src="app.js"></script>
</body>
</html>
